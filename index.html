<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coffee Machine Payoff Tracker</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f6efe7; /* creamy background */
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      background: #fffaf3;
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 28px;
    }

    .icon {
      text-align: center;
      font-size: 48px;
    }

    .big-count {
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      margin: 8px 0;
    }

    .main-button {
      font-size: 24px;
      padding: 20px;
      border-radius: 16px;
      border: none;
      background: #8b5e3c;
      color: white;
      cursor: pointer;
    }

    .main-button:active {
      transform: scale(0.98);
    }

    .expense {
      display: flex;
      gap: 8px;
    }

    .expense input {
      flex: 1;
      font-size: 18px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    .expense button {
      font-size: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      border: none;
      background: #4caf50;
      color: white;
      cursor: pointer;
    }

    .stats {
      font-size: 18px;
      line-height: 1.5;
    }

    .bar {
      background: #e0d6cc;
      border-radius: 10px;
      overflow: hidden;
      height: 24px;
    }

    .bar-inner {
      background: #c89b6a;
      height: 100%;
      width: 0%;
      transition: width 0.3s;
    }

    .footer {
      margin-top: auto;
      text-align: center;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="icon">☕</div>
    <h1>Coffee Payoff Tracker</h1>

    <div class="big-count" id="coffeeCount">0 coffees</div>

    <button class="main-button" id="addCoffeeBtn">I made a coffee</button>

    <div class="expense">
      <input id="expenseInput" type="number" step="0.01" placeholder="Add expense ($)" />
      <button id="addExpenseBtn">Add</button>
    </div>

    <div class="stats" id="stats"></div>

    <div class="bar">
      <div class="bar-inner" id="progressBar"></div>
    </div>

    <div class="footer">
      Saved on this device
    </div>
  </div>

  <script>
    // ---- Your base numbers ----
    const baseMachineCost = 1000;

    const cafePrice = 5.0;

    const beansCostPerCup = 60 / 100;        // $0.60
    const cleaningCostPerCup = 10 / 250;      // $0.04
    const milkCostPerCup = 4 * (200 / 3000);  // ~$0.27

    const homemadeCostPerCup = beansCostPerCup + cleaningCostPerCup + milkCostPerCup;
    const savingPerCup = cafePrice - homemadeCostPerCup;
    // ---------------------------

    const addCoffeeBtn = document.getElementById("addCoffeeBtn");
    const coffeeCountDiv = document.getElementById("coffeeCount");
    const statsDiv = document.getElementById("stats");
    const progressBar = document.getElementById("progressBar");
    const expenseInput = document.getElementById("expenseInput");
    const addExpenseBtn = document.getElementById("addExpenseBtn");

    let coffeeCount = parseInt(localStorage.getItem("coffeeCount") || "0", 10);
    let extraInvested = parseFloat(localStorage.getItem("extraInvested") || "0");
    let startDate = localStorage.getItem("startDate");

    if (!startDate) {
      startDate = new Date().toISOString();
      localStorage.setItem("startDate", startDate);
    }

    function save() {
      localStorage.setItem("coffeeCount", coffeeCount.toString());
      localStorage.setItem("extraInvested", extraInvested.toString());
      localStorage.setItem("startDate", startDate);
    }

    function daysBetween(a, b) {
      const msPerDay = 1000 * 60 * 60 * 24;
      return Math.max(1, Math.floor((b - a) / msPerDay));
    }

    function render() {
      const investedTotal = baseMachineCost + extraInvested;
      const totalSaved = coffeeCount * savingPerCup;
      const remaining = Math.max(0, investedTotal - totalSaved);
      const coffeesToGo = remaining > 0 ? Math.ceil(remaining / savingPerCup) : 0;

      coffeeCountDiv.textContent = `${coffeeCount} coffees`;

      const percent = Math.min(100, (totalSaved / investedTotal) * 100);
      progressBar.style.width = percent + "%";

      // Estimate break-even date
      const start = new Date(startDate);
      const now = new Date();
      const daysSoFar = daysBetween(start, now);
      const avgPerDay = coffeeCount / daysSoFar;

      let breakEvenText = "Not enough data yet";

      if (avgPerDay > 0) {
        const totalCoffeesNeeded = Math.ceil(investedTotal / savingPerCup);
        const daysNeeded = Math.ceil(totalCoffeesNeeded / avgPerDay);
        const breakEvenDate = new Date(start.getTime() + daysNeeded * 24 * 60 * 60 * 1000);
        breakEvenText = breakEvenDate.toDateString();
      }

      statsDiv.innerHTML = `
        <strong>Per coffee</strong><br>
        Café: $${cafePrice.toFixed(2)}<br>
        Homemade: $${homemadeCostPerCup.toFixed(2)}<br>
        You save: $${savingPerCup.toFixed(2)}<br><br>

        <strong>Investment</strong><br>
        Machine: $${baseMachineCost.toFixed(2)}<br>
        Extras: $${extraInvested.toFixed(2)}<br>
        Total: $${investedTotal.toFixed(2)}<br><br>

        <strong>Progress</strong><br>
        Saved: $${totalSaved.toFixed(2)}<br>
        Remaining: $${remaining.toFixed(2)}<br>
        Coffees to go: ${coffeesToGo}<br><br>

        <strong>Estimate</strong><br>
        Avg / day: ${avgPerDay.toFixed(2)}<br>
        Break-even: ${breakEvenText}
      `;
    }

    addCoffeeBtn.addEventListener("click", () => {
      coffeeCount++;
      save();
      render();
    });

    addExpenseBtn.addEventListener("click", () => {
      const value = parseFloat(expenseInput.value);
      if (isNaN(value) || value <= 0) return;

      extraInvested += value;
      expenseInput.value = "";
      save();
      render();
    });

    render();
  </script>
</body>
</html>
